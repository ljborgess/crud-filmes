<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo de Filmes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #fcfcfc;
        --text: #191a1a;
        --text-muted: #6b7280;
        --border: #e5e5e5;
        --border-strong: #d4d4d4;
        --surface: #ffffff;
        --badge-bg: #f0f0f0;
        --badge-text: #3f3f3f;
        --red: #b42323;
        --red-dark: #8f1c1c;
    }
    * { box-sizing: border-box; }
    body {
        font-family: 'Inter', Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
    }
    .navbar {
        background: var(--bg);
        border-bottom: 1px solid var(--border);
        padding: 20px 32px;
    }
    .navbar .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        max-width: 1040px;
        margin: 0 auto;
        color: var(--text);
        text-decoration: none;
        font-weight: 600;
        font-size: 1.05em;
        letter-spacing: -0.01em;
    }
    .navbar .brand svg {
        width: 22px;
        height: 22px;
        stroke: var(--text);
        flex-shrink: 0;
    }
    main {
        max-width: 1040px;
        margin: 0 auto;
        padding: 64px 24px 80px;
    }
    .page-header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 20px;
        margin-bottom: 44px;
    }
    .page-header h1 {
        margin: 0;
        font-size: 2.1em;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--text);
    }
    .btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border: 1px solid transparent;
        border-radius: 10px;
        padding: 11px 20px;
        font-family: inherit;
        font-size: 0.9em;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        text-align: center;
        transition: background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
    }
    .btn svg {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        flex-shrink: 0;
    }
    .btn-primary {
        background: var(--text);
        color: #fff;
    }
    .btn-primary:hover { background: #2e2f2f; }
    .btn-outline {
        background: transparent;
        border-color: var(--border-strong);
        color: var(--text);
    }
    .btn-outline:hover { background: #f5f5f5; }
    .btn-excluir {
        background: var(--red);
        color: #fff;
    }
    .btn-excluir:hover { background: var(--red-dark); }
    .cartoes {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
    }
    .cartao {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 28px;
        width: 280px;
        transition: border-color 0.15s ease;
    }
    .cartao:hover { border-color: var(--border-strong); }
    .cartao .avatar {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: var(--text);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 1.1em;
        margin-bottom: 16px;
    }
    .cartao h2 {
        margin: 0 0 8px 0;
        font-size: 1.1em;
        font-weight: 600;
        color: var(--text);
    }
    .cartao .genero {
        display: inline-block;
        background: var(--badge-bg);
        color: var(--badge-text);
        font-size: 0.75em;
        font-weight: 500;
        padding: 4px 12px;
        border-radius: 20px;
        margin-bottom: 14px;
    }
    .cartao .sinopse {
        color: var(--text-muted);
        font-size: 0.9em;
        line-height: 1.55em;
        margin-bottom: 22px;
        min-height: 2.2em;
    }
    .cartao .acoes {
        display: flex;
        gap: 8px;
    }
    .cartao .acoes .btn {
        flex: 1;
        padding: 9px 0;
        font-size: 0.82em;
        justify-content: center;
    }
    .vazio {
        text-align: center;
        color: var(--text-muted);
        width: 100%;
        padding: 60px 0;
        font-size: 0.95em;
    }
</style>
</head>
<body>
    <header class="navbar">
        <a href="{% url 'lista_filmes' %}" class="brand">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M7 3v18M17 3v18M2 8h5M2 16h5M17 8h5M17 16h5"/></svg>
            <span>Catálogo de Filmes</span>
        </a>
    </header>
    <main>
        <div class="page-header">
            <h1>Filmes cadastrados</h1>
            <a href="{% url 'criar_filme' %}" class="btn btn-primary">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Novo Filme
            </a>
        </div>
        <div class="cartoes">
            {% for filme in filmes %}
            <div class="cartao">
                <div class="avatar">{{ filme.titulo|first|upper }}</div>
                <h2>{{ filme.titulo }}</h2>
                <span class="genero">{{ filme.genero }}</span>
                <p class="sinopse">{{ filme.sinopse }}</p>
                <div class="acoes">
                    <a href="{% url 'editar_filme' filme.pk %}" class="btn btn-primary">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
                        Editar
                    </a>
                    <a href="{% url 'excluir_filme' filme.pk %}" class="btn btn-excluir">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                        Excluir
                    </a>
                </div>
            </div>
            {% empty %}
            <p class="vazio">Nenhum filme cadastrado ainda.</p>
            {% endfor %}
        </div>
    </main>
</body>
</html>
