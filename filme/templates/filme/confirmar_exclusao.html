<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Excluir Filme · Catálogo de Filmes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #fcfcfc;
        --text: #191a1a;
        --text-muted: #6b7280;
        --border: #e5e5e5;
        --border-strong: #d4d4d4;
        --surface: #ffffff;
        --red: #b42323;
        --red-dark: #8f1c1c;
    }
    * { box-sizing: border-box; }
    body {
        font-family: 'Inter', Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
    }
    .navbar {
        background: var(--bg);
        border-bottom: 1px solid var(--border);
        padding: 20px 32px;
    }
    .navbar .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        max-width: 1040px;
        margin: 0 auto;
        color: var(--text);
        text-decoration: none;
        font-weight: 600;
        font-size: 1.05em;
        letter-spacing: -0.01em;
    }
    .navbar .brand svg {
        width: 22px;
        height: 22px;
        stroke: var(--text);
        flex-shrink: 0;
    }
    main {
        max-width: 460px;
        margin: 0 auto;
        padding: 72px 24px 80px;
    }
    h1 {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin: 0 0 32px 0;
        font-size: 1.8em;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--red-dark);
        text-align: center;
    }
    h1 svg {
        width: 22px;
        height: 22px;
        stroke: var(--red-dark);
        flex-shrink: 0;
    }
    .cartao {
        background: var(--surface);
        border: 1px solid var(--border);
        border-top: 3px solid var(--red);
        border-radius: 18px;
        padding: 32px;
    }
    .cartao p { margin: 0 0 4px 0; }
    .nome {
        font-weight: 600;
        font-size: 1.1em;
        color: var(--text);
    }
    .genero {
        color: var(--text-muted);
        font-size: 0.9em;
        margin-bottom: 20px !important;
    }
    .aviso {
        background: rgba(180, 35, 35, 0.08);
        color: var(--red-dark);
        font-size: 0.85em;
        padding: 11px 14px;
        border-radius: 10px;
        margin-bottom: 24px !important;
    }
    .acoes {
        display: flex;
        gap: 8px;
    }
    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        border: 1px solid transparent;
        border-radius: 10px;
        padding: 11px 20px;
        font-family: inherit;
        font-size: 0.9em;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        text-align: center;
        flex: 1;
        transition: background 0.15s ease, border-color 0.15s ease;
    }
    .btn svg {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        flex-shrink: 0;
    }
    .btn-excluir {
        background: var(--red);
        color: #fff;
    }
    .btn-excluir:hover { background: var(--red-dark); }
    .btn-outline {
        background: transparent;
        border-color: var(--border-strong);
        color: var(--text);
    }
    .btn-outline:hover { background: #f5f5f5; }
</style>
</head>
<body>
    <header class="navbar">
        <a href="{% url 'lista_filmes' %}" class="brand">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M7 3v18M17 3v18M2 8h5M2 16h5M17 8h5M17 16h5"/></svg>
            <span>Catálogo de Filmes</span>
        </a>
    </header>
    <main>
        <h1>
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 1 21h22L12 2z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            Confirmar exclusão
        </h1>
        <div class="cartao">
            <p>Você tem certeza que deseja excluir o filme:</p>
            <p class="nome">{{ filme.titulo }}</p>
            <p class="genero">Gênero: {{ filme.genero }}</p>
            <p class="aviso">Esta ação não pode ser desfeita!</p>

            <form method="post">
                {% csrf_token %}
                <div class="acoes">
                    <button type="submit" class="btn btn-excluir">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                        Sim, excluir
                    </button>
                    <a href="{% url 'lista_filmes' %}" class="btn btn-outline">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
