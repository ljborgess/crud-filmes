<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ titulo_pagina }} · Catálogo de Filmes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #fcfcfc;
        --text: #191a1a;
        --text-muted: #6b7280;
        --border: #e5e5e5;
        --border-strong: #d4d4d4;
        --surface: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
        font-family: 'Inter', Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
    }
    .navbar {
        background: var(--bg);
        border-bottom: 1px solid var(--border);
        padding: 20px 32px;
    }
    .navbar .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        max-width: 1040px;
        margin: 0 auto;
        color: var(--text);
        text-decoration: none;
        font-weight: 600;
        font-size: 1.05em;
        letter-spacing: -0.01em;
    }
    .navbar .brand svg {
        width: 22px;
        height: 22px;
        stroke: var(--text);
        flex-shrink: 0;
    }
    main {
        max-width: 480px;
        margin: 0 auto;
        padding: 72px 24px 80px;
    }
    h1 {
        margin: 0 0 32px 0;
        font-size: 1.9em;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--text);
        text-align: center;
    }
    .cartao {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 32px;
    }
    label {
        display: block;
        margin-bottom: 7px;
        font-weight: 500;
        color: var(--text);
        font-size: 0.88em;
    }
    input, textarea, select {
        width: 100%;
        box-sizing: border-box;
        padding: 11px 14px;
        margin-bottom: 20px;
        border: 1px solid var(--border);
        border-radius: 10px;
        font-family: inherit;
        font-size: 0.95em;
        color: var(--text);
        background: var(--bg);
        transition: border-color 0.12s ease, box-shadow 0.12s ease;
    }
    input:focus, textarea:focus, select:focus {
        outline: none;
        border-color: var(--text);
        box-shadow: 0 0 0 3px rgba(25,26,26,0.08);
        background: #fff;
    }
    textarea { resize: vertical; }
    select { cursor: pointer; }
    .acoes {
        display: flex;
        gap: 8px;
    }
    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        border: 1px solid transparent;
        border-radius: 10px;
        padding: 11px 20px;
        font-family: inherit;
        font-size: 0.9em;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        text-align: center;
        flex: 1;
        transition: background 0.15s ease, border-color 0.15s ease;
    }
    .btn svg {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        flex-shrink: 0;
    }
    .btn-primary {
        background: var(--text);
        color: #fff;
    }
    .btn-primary:hover { background: #2e2f2f; }
    .btn-outline {
        background: transparent;
        border-color: var(--border-strong);
        color: var(--text);
    }
    .btn-outline:hover { background: #f5f5f5; }
</style>
</head>
<body>
    <header class="navbar">
        <a href="{% url 'lista_filmes' %}" class="brand">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M7 3v18M17 3v18M2 8h5M2 16h5M17 8h5M17 16h5"/></svg>
            <span>Catálogo de Filmes</span>
        </a>
    </header>
    <main>
        <h1>{{ titulo_pagina }}</h1>
        <div class="cartao">
            <form method="post">
                {% csrf_token %}

                <label for="titulo">Título</label>
                <input type="text" id="titulo" name="titulo" value="{{ filme.titulo|default:'' }}"
                       placeholder="Título do filme" required>

                <label for="genero">Gênero</label>
                <select id="genero" name="genero" required>
                    <option value="" disabled {% if not filme %}selected{% endif %}>Selecione um gênero</option>
                    {% for genero in generos %}
                    <option value="{{ genero.pk }}" {% if filme.genero_id == genero.pk %}selected{% endif %}>{{ genero.nome }}</option>
                    {% endfor %}
                </select>

                <label for="sinopse">Sinopse</label>
                <textarea id="sinopse" name="sinopse" rows="3" maxlength="280"
                          placeholder="Escreva uma breve sinopse...">{{ filme.sinopse|default:'' }}</textarea>

                <div class="acoes">
                    <button type="submit" class="btn btn-primary">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                        Salvar
                    </button>
                    <a href="{% url 'lista_filmes' %}" class="btn btn-outline">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                        Voltar
                    </a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
