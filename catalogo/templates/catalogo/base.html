{% load static %}<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Catálogo de Filmes{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'catalogo/style.css' %}">
</head>
<body>
    <header class="navbar">
        <div class="interno">
            <a href="{% url 'dashboard' %}" class="brand">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M7 3v18M17 3v18M2 8h5M2 16h5M17 8h5M17 16h5"/></svg>
                <span>Catálogo de Filmes</span>
            </a>
            {% with rota=request.resolver_match.url_name %}
            <nav>
                <a href="{% url 'dashboard' %}" class="{% if rota == 'dashboard' %}ativo{% endif %}">Painel</a>
                <a href="{% url 'lista_filmes' %}" class="{% if 'filme' in rota %}ativo{% endif %}">Filmes</a>
                <a href="{% url 'lista_diretores' %}" class="{% if 'diretor' in rota %}ativo{% endif %}">Diretores</a>
                <a href="{% url 'lista_generos' %}" class="{% if 'genero' in rota %}ativo{% endif %}">Gêneros</a>
                <a href="{% url 'lista_avaliacoes' %}" class="{% if 'avalia' in rota %}ativo{% endif %}">Avaliações</a>
            </nav>
            {% endwith %}
        </div>
    </header>
    <main class="{% block largura %}{% endblock %}">
        {% block conteudo %}{% endblock %}
    </main>
</body>
</html>
